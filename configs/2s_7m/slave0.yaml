# Motor chain configuration for SLAVE-0.
#
# Single source of truth for motor identity, model, and limits. Both the
# firmware (firmware/common/include/motor_config.h) and the host tools
# (tools/motor_config_gen.py) are GENERATED from this file:
#
#     python3 scripts/gen_motor_config.py configs/slave0.yaml
#
# Edit this file, regenerate, then rebuild firmware. Do not hand-edit the
# generated files.

slave: slave0

# Per-model CAN "operation control mode" (Communication Type 1) ranges, taken
# from the RobStride user manuals (Type 1 tables):
#   RS00User Manual260428.pdf p.39, RS02User Manual260428.pdf p.41
# Position (±4π), Kp (0..500) and Kd (0..5) are identical across both models;
# only velocity and torque differ.
shared_ranges:
  p_min: -12.57   # rad  (-4*pi)
  p_max:  12.57   # rad  (+4*pi)
  kp_min:  0.0
  kp_max:  500.0
  kd_min:  0.0
  kd_max:  5.0

models:
  RS00:
    v_min: -33.0   # rad/s
    v_max:  33.0
    t_min: -14.0   # Nm
    t_max:  14.0
  RS02:
    v_min: -44.0   # rad/s
    v_max:  44.0
    t_min: -17.0   # Nm
    t_max:  17.0

# Motors in chain order. motor_idx is the array index (0-based); can_id is the
# RobStride node id on the bus. The host client displays id = motor_idx + 1.
motors:
  - idx: 0
    can_id: 1
    model: RS02
    joint_name: motor0
    soft_min: -0.79   # ~45 deg
    soft_max:  0.79
    max_vel:   10.0
    max_tau:   0.8    # Nm — torque trip: exceed and the motor drops to IDLE
    default_kp: 15.0
    default_kd:  1.0
  - idx: 1
    can_id: 2
    model: RS02
    joint_name: motor1
    soft_min: -1.05   # ~60 deg
    soft_max:  1.05
    max_vel:   10.0
    max_tau:   0.8    # Nm — torque trip: exceed and the motor drops to IDLE
    default_kp: 15.0
    default_kd:  1.0
  - idx: 2
    can_id: 3
    model: RS00
    joint_name: motor2
    soft_min: -1.31   # ~75 deg
    soft_max:  1.31
    max_vel:   10.0
    max_tau:   0.8    # Nm — torque trip: exceed and the motor drops to IDLE
    default_kp: 15.0
    default_kd:  1.0
  - idx: 3
    can_id: 4
    model: RS00
    joint_name: motor3
    soft_min: -1.05   # ~60 deg
    soft_max:  1.05
    max_vel:   10.0
    max_tau:   0.8    # Nm — torque trip: exceed and the motor drops to IDLE
    default_kp: 15.0
    default_kd:  1.0
  - idx: 4
    can_id: 5
    model: RS00
    joint_name: motor4
    soft_min: -0.52   # ~30 deg
    soft_max:  0.52
    max_vel:   10.0
    max_tau:   0.8    # Nm — torque trip: exceed and the motor drops to IDLE
    default_kp: 15.0
    default_kd:  1.0
