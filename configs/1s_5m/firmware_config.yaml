# firmware_config.yaml — schema v2, HAND-MAINTAINED in soccer-firmware for now.
# (The soccer-software export is suspended until it adopts this schema; do NOT
# re-import over this file. import_firmware_config.py / content_sha256 resume
# when the exporter catches up.)
#
# Carries ONLY what varies per robot. Each motor is three blocks:
#   identity — can_id / model / joint_name: three names for one physical motor
#   user     — tier-2 operating envelope, inside the RS vendor limits (tier 1,
#              firmware/common/include/motor_rs_limits.h). Names mirror
#              MotorRsLimits; default_kp/kd are applied on USE_CONFIG_GAINS.
#   fallback — tier-3 dead-man damp MIT constants (pos=current, vel=0 implied);
#              REQUIRED and explicit: these run when no host is alive.
# A motor's slave and chain index come from position (containment + list order).
# Rates/timeouts are firmware constants in scripts/gen_motor_config.py, and RS
# vendor ranges live in motor_rs_limits.h — neither belongs in this file.
setup: 1s_5m
slaves:
- slave: slave0
  motors:
  - identity: { can_id: 1, model: RS02, joint_name: bench_j1 }
    user:     { p_min: -0.79, p_max: 0.79, v_max: 10.0, t_max: 3.0,
                default_kp: 15.0, default_kd: 1.0 }
    fallback: { kp: 0.0, kd: 1.0, tau: 0.0 }
  - identity: { can_id: 2, model: RS02, joint_name: bench_j2 }
    user:     { p_min: -1.05, p_max: 1.05, v_max: 10.0, t_max: 3.0,
                default_kp: 15.0, default_kd: 1.0 }
    fallback: { kp: 0.0, kd: 1.0, tau: 0.0 }
  - identity: { can_id: 3, model: RS00, joint_name: bench_j3 }
    user:     { p_min: -1.31, p_max: 1.31, v_max: 10.0, t_max: 3.0,
                default_kp: 15.0, default_kd: 1.0 }
    fallback: { kp: 0.0, kd: 1.0, tau: 0.0 }
  - identity: { can_id: 4, model: RS00, joint_name: bench_j4 }
    user:     { p_min: -1.31, p_max: 1.31, v_max: 10.0, t_max: 3.0,
                default_kp: 15.0, default_kd: 1.0 }
    fallback: { kp: 0.0, kd: 1.0, tau: 0.0 }
  - identity: { can_id: 5, model: RS00, joint_name: bench_j5 }
    user:     { p_min: -1.31, p_max: 1.31, v_max: 10.0, t_max: 3.0,
                default_kp: 15.0, default_kd: 1.0 }
    fallback: { kp: 0.0, kd: 1.0, tau: 0.0 }
